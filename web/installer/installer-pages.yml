# Web-Installer auf GitHub Pages (ADR 0054): baut die Seite aus web/installer/ und den Paketen in firmware/.
name: Web-Installer (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["firmware/**", "web/installer/**", "platform/tools/fm1_install.py", ".github/workflows/installer-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test (JS gegen fm1_install.py, ohne Gerät)
        run: node web/installer/test/test.mjs
      - name: Seite bauen
        run: python3 web/installer/make_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
